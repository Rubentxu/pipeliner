[workspace]
resolver = "2"
members = [
    "crates/pipeliner-core",
    "crates/pipeliner-macros",
    "crates/pipeliner-executor",
    "crates/pipeliner-runtime",
]

# Example crates (declarative pipelines)
[[example]]
name = "simple-ci"
path = "examples/src/main.rs"

[[example]]
name = "petclinic"
path = "examples/petclinic.rs"

[[example]]
name = "dsl-runner"
path = "examples/dsl-runner.rs"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7" }
async-trait = "0.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

clap = { version = "4.0", features = ["derive", "cargo"] }
clap_complete = "4.0"
clap_mangen = "4.0"
notify = "6"
prost = "0.12"
prost-types = "0.12"
tonic = { version = "0.10", features = ["prost", "tls"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "std"] }
regex = "1.0"
once_cell = "1.0"
parking_lot = "0.12"
proptest = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
proc-macro2 = "1.0"
rstest = "0.18"
pretty_assertions = "1.0"
tempfile = "3.0"
dirs = "5.0"
os_pipe = "0.9"
shell-words = "1.0"
which = "6.0"
rustix = "0.38"
memfd = "0.6"
itertools = "0.13"
indexmap = "2.0"

[package]
name = "pipeliner"
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"
authors = ["Pipeliner Contributors"]
description = "A Jenkins Pipeline DSL in Rust - CLI tools for pipelines"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rubentxu/pipeliner"
homepage = "https://github.com/Rubentxu/pipeliner"
documentation = "https://docs.rs/pipeliner"
keywords = ["ci", "cd", "pipeline", "jenkins", "dsl"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
pipeliner-macros = { path = "crates/pipeliner-macros" }
pipeliner-core = { path = "crates/pipeliner-core" }
serde_json = { workspace = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
