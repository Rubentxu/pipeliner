[package]
name = "pipeliner"
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"
authors = ["Pipeliner Contributors"]
description = "A Jenkins Pipeline DSL in Rust - CLI tools for pipelines"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rubentxu/pipeliner"
homepage = "https://github.com/Rubentxu/pipeliner"
documentation = "https://docs.rs/pipeliner"
keywords = ["ci", "cd", "pipeline", "jenkins", "dsl"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Logging and observability
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Workspace crates
pipeliner-cli = { path = "crates/pipeliner-cli" }
pipeliner-core = { path = "crates/pipeliner-core" }
pipeliner-macros = { path = "crates/pipeliner-macros" }
pipeliner-executor = { path = "crates/pipeliner-executor" }

[[bin]]
name = "pipeliner"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
