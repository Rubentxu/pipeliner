[package]
name = "pipeliner-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"
description = "Local pipeline execution runtime for Pipeliner"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pipeliner-org/pipeliner"
documentation = "https://docs.rs/pipeliner-runtime"
keywords = ["pipeline", "runtime", "executor"]
categories = ["development-tools"]

[dependencies]
# Workspace dependencies
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde", "std"] }

# Internal crates
pipeliner-core = { path = "../pipeliner-core" }
pipeliner-credentials = { path = "../pipeliner-credentials" }

# Utilities
futures = "0.3"
parking_lot = { workspace = true }
glob = "0.3"

# Archive support
zip = "2"
tar = "0.4"
flate2 = "1"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true }

[lib]
name = "pipeliner_runtime"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
