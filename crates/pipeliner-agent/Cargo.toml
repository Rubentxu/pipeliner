[package]
name = "pipeliner-agent"
version = "0.1.0"
edition = "2021"
description = "Agent step execution for Pipeliner using Rig"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rubentxu/pipeliner"
authors = ["Pipeliner Contributors"]

[features]
# Enable real Rig LLM integration (default)
rig = []

[dependencies]
# Core
pipeliner-core = { path = "../pipeliner-core" }
pipeliner-macros = { path = "../pipeliner-macros" }

# Rig for LLM (always available, stub used when rig feature disabled)
rig-core = { version = "0.37", package = "rig" }
rig-mcp = "0.1"
rig-resources = "0.1"

# Async
async-trait = "0.1"
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
pretty_assertions = "1.4"
tempfile = "3"

[[example]]
name = "agent-pipeline"
path = "examples/agent-pipeline.rs"
