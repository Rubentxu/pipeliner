[package]
name = "pipeliner-steps-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"
description = "Config and workspace step tools for Pipeliner"
license = "MIT OR Apache-2.0"

[dependencies]
pipeliner-core = { path = "../pipeliner-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
glob = "0.3"
remove_dir_all = "0.8"

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
