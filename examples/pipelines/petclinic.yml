name: PetClinic Pipeline
stages:
  - build
  - test
  - verify
  - report

build:
  steps:
    - cargo build --release --bin pipeliner
    - echo Pipeline ready

test:
  steps:
    - cargo test --all
    - cargo test --doc

verify:
  steps:
    - ls -lh target/release/pipeliner
    - stat target/release/pipeliner
    - cargo build --release

report:
  steps:
    - echo "=== Pipeline $PIPELINE_NAME"
    - echo "Binary: target/release/pipeliner"

notify:
  - echo "Build successful ✅"
